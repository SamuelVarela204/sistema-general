<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assest/sty.css">
    <title>Registro</title>
</head>
<body>
    <!-- Volver -->
    <form action="../index.html" class="back-form"><button class="back-btn" type="submit">← Volver</button></form>

    <!-- Zona central (tarjeta) -->
    <div class="spc" style="width: 500xp; height: 500xp; gap: 20px;">
        <h1>REGISTRO</h1>
        <div class="profile-center">
            <label for="profile-pic" style="cursor: pointer; width:100%; height:100%; display:flex; align-items:center; justify-content:center;">
                <div id="circle-preview" class="cirp" aria-hidden="true"></div>
            </label>
        </div>
        <h1>Seleccione su imagen de perfil</h1>

        <!-- Formulario de registro (mantiene la funcionalidad de carga de imagen) -->
        <form action="princ.html" method="post" class="login" style="width:100%; gap:12px;" novalidate>
            <input type="file" id="profile-pic" accept="image/*" style="display:none;">
            <input type="text" name="nombre" placeholder="Nombre" required class="input-pastel" autocomplete="name">
            <input type="email" name="correo" placeholder="Correo electrónico" required class="input-pastel" autocomplete="email">
            <input type="password" name="contrasena" placeholder="Contraseña" required class="input-pastel" autocomplete="new-password">

            <label style="font-size:0.95rem; display:flex; gap:8px; align-items:center;">
                <input type="checkbox" name="terminos" required style="transform:scale(1.02);"> <a href="https://youtu.be/GBcJyVTDYH4?si=n4nbXmE4rR3g0FKH&t=8">Acepto los términos y condiciones</a>
            </label>

            <button type="submit" class="submit-btn" style="width:100%;">Registrar</button>
        </form>
    </div>

<script>
    // mantiene la función de previsualizar la imagen en el círculo
    document.getElementById('profile-pic').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            const circle = document.getElementById('circle-preview');
            circle.style.backgroundImage = `url('${evt.target.result}')`;
            circle.textContent = '';
        };
        reader.readAsDataURL(file);
    });

    // permitir abrir selector al hacer click en el preview (por compatibilidad)
    document.getElementById('circle-preview').addEventListener('click', function() {
        document.getElementById('profile-pic').click();
    });
    </script>
</body>
</html>
