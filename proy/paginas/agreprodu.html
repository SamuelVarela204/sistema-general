<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assest/agre_pro.css">
    <title>Document</title>
</head>
<body>
    <div class="form-container">
    <h2>Agregar Producto</h2>

    <form action="insert_pro" method="POST">
        <!-- Cambié name="nombre" por name="nom_pro" para que coincida con el PHP -->
        <label>Nombre:</label>
        <input type="text" name="nom_pro" required>

        <label>Descripción:</label>
        <textarea name="descripcion"></textarea>

        <label>Precio:</label>
        <input type="number" step="0.01" name="precio" required>

        <!-- Cambié name="cantidad" por name="stock" para que coincida con el PHP -->
        <label>Cantidad:</label>
        <input type="number" name="stock" required>

        <label>Categoría:</label>
        <input type="text" name="categoria">
        
        <button type="submit">Guardar Producto</button>
    </form>
</div>

</body>
</html>
